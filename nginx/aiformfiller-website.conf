server {
    listen 80;
    server_name aiformfiller.org www.aiformfiller.org;

    # Certbot will append HTTPS redirect here automatically
    root /var/www/aiformfiller-website;
    index index.html;

    # Static HTML — serve files directly
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-lived cache for versioned assets (CSS/JS)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
}
